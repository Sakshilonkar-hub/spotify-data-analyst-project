<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="60" y="80" font-size="32" font-family="Arial" fill="#0f172a" font-weight="bold">Data Cleaning Workflow</text>

  <g>
    <rect x="60" y="150" width="210" height="100" rx="15" fill="#dbeafe"/>
    <text x="98" y="200" font-size="20" fill="#1e3a8a" font-family="Arial">1. Raw CSV</text>
  </g>
  <g>
    <rect x="330" y="150" width="210" height="100" rx="15" fill="#dcfce7"/>
    <text x="364" y="200" font-size="20" fill="#166534" font-family="Arial">2. Drop nulls</text>
  </g>
  <g>
    <rect x="600" y="150" width="210" height="100" rx="15" fill="#fef3c7"/>
    <text x="624" y="200" font-size="20" fill="#92400e" font-family="Arial">3. Normalize</text>
  </g>
  <g>
    <rect x="870" y="150" width="210" height="100" rx="15" fill="#fee2e2"/>
    <text x="895" y="200" font-size="20" fill="#991b1b" font-family="Arial">4. Clean data</text>
  </g>

  <line x1="270" y1="200" x2="330" y2="200" stroke="#64748b" stroke-width="3"/>
  <line x1="540" y1="200" x2="600" y2="200" stroke="#64748b" stroke-width="3"/>
  <line x1="810" y1="200" x2="870" y2="200" stroke="#64748b" stroke-width="3"/>

  <rect x="90" y="330" width="1020" height="250" rx="18" fill="#111827"/>
  <text x="125" y="375" font-size="22" fill="#f8fafc" font-family="Arial">Cleaning rules used</text>
  <text x="125" y="430" font-size="18" fill="#cbd5e1" font-family="Arial">• Remove blank/duplicate records</text>
  <text x="125" y="470" font-size="18" fill="#cbd5e1" font-family="Arial">• Standardize artist/track capitalization</text>
  <text x="125" y="510" font-size="18" fill="#cbd5e1" font-family="Arial">• Convert duration_ms to minutes</text>
  <text x="125" y="550" font-size="18" fill="#cbd5e1" font-family="Arial">• Fix missing genre values and timestamps</text>
</svg>
