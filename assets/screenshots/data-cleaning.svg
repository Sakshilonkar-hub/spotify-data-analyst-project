<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#0f172a"/>
  <text x="60" y="80" font-size="34" font-family="Arial" fill="#f8fafc" font-weight="bold">Spotify Data Analyst Project</text>
  <text x="60" y="120" font-size="18" font-family="Arial" fill="#cbd5e1">Listening behavior analysis using PostgreSQL, SQL, and AI</text>

  <rect x="60" y="170" width="260" height="120" rx="12" fill="#1d4ed8"/>
  <text x="90" y="220" font-size="22" fill="#ffffff" font-family="Arial">Top Track</text>
  <text x="90" y="255" font-size="32" fill="#ffffff" font-family="Arial" font-weight="bold">Levitating</text>

  <rect x="360" y="170" width="260" height="120" rx="12" fill="#16a34a"/>
  <text x="395" y="220" font-size="22" fill="#ffffff" font-family="Arial">Plays</text>
  <text x="395" y="255" font-size="32" fill="#ffffff" font-family="Arial" font-weight="bold">4</text>

  <rect x="660" y="170" width="260" height="120" rx="12" fill="#f59e0b"/>
  <text x="695" y="220" font-size="22" fill="#ffffff" font-family="Arial">Top Artist</text>
  <text x="695" y="255" font-size="30" fill="#ffffff" font-family="Arial" font-weight="bold">Dua Lipa</text>

  <rect x="960" y="170" width="180" height="120" rx="12" fill="#dc2626"/>
  <text x="990" y="220" font-size="22" fill="#ffffff" font-family="Arial">AI Score</text>
  <text x="990" y="255" font-size="32" fill="#ffffff" font-family="Arial" font-weight="bold">92%</text>

  <g>
    <rect x="80" y="360" width="220" height="220" fill="#111827" rx="10"/>
    <text x="110" y="395" font-size="19" fill="#f8fafc" font-family="Arial">Top tracks</text>
    <line x1="110" y1="420" x2="270" y2="420" stroke="#374151"/>
    <rect x="110" y="435" width="30" height="105" fill="#60a5fa"/>
    <rect x="150" y="455" width="30" height="85" fill="#6ee7b7"/>
    <rect x="190" y="470" width="30" height="70" fill="#fbbf24"/>
    <rect x="230" y="485" width="30" height="55" fill="#fca5a5"/>
  </g>

  <g>
    <rect x="360" y="360" width="280" height="220" fill="#111827" rx="10"/>
    <text x="390" y="395" font-size="19" fill="#f8fafc" font-family="Arial">Artist performance</text>
    <text x="390" y="440" font-size="18" fill="#cbd5e1" font-family="Arial">Dua Lipa — 4 plays</text>
    <text x="390" y="475" font-size="18" fill="#cbd5e1" font-family="Arial">Miley Cyrus — 4 plays</text>
    <text x="390" y="510" font-size="18" fill="#cbd5e1" font-family="Arial">Sabrina — 3 plays</text>
    <text x="390" y="545" font-size="18" fill="#cbd5e1" font-family="Arial">Harry Styles — 3 plays</text>
  </g>

  <g>
    <rect x="700" y="360" width="390" height="220" fill="#111827" rx="10"/>
    <text x="730" y="395" font-size="19" fill="#f8fafc" font-family="Arial">AI insight summary</text>
    <text x="730" y="435" font-size="16" fill="#cbd5e1" font-family="Arial">• Upbeat pop dominates listening hours</text>
    <text x="730" y="470" font-size="16" fill="#cbd5e1" font-family="Arial">• Strong mood-based playlist potential</text>
    <text x="730" y="505" font-size="16" fill="#cbd5e1" font-family="Arial">• Personal recommendations should target</text>
    <text x="730" y="540" font-size="16" fill="#cbd5e1" font-family="Arial">  top artists and high-energy songs</text>
  </g>
</svg>
